import com.android.build.api.artifact.SingleArtifact
import groovy.json.JsonSlurper
import org.w3c.dom.Element

import javax.xml.parsers.DocumentBuilderFactory
import javax.xml.transform.TransformerFactory
import javax.xml.transform.dom.DOMSource
import javax.xml.transform.stream.StreamResult
import java.nio.file.Files
import java.nio.file.StandardCopyOption

apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

dependencies {
    // Declare before autolinking: pickFirst must select this shared AOSL version,
    // rather than the older copy bundled in RTM. RTC and Chat need its new symbols.
    // https://doc.shengwang.cn/faq/integration-issues/rtm2-rtc-integration-issue
    implementation("io.agora.infra:aosl:1.3.5")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
    // Bound Metro's memory use while Gradle compiles native modules in parallel.
    extraPackagerArgs = ["--max-workers", "4"]
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// Supply these through ~/.gradle/gradle.properties or environment variables.
def uploadSigning = [
    storeFile: providers.gradleProperty('APPBUILDER_UPLOAD_STORE_FILE').orElse(providers.environmentVariable('APPBUILDER_UPLOAD_STORE_FILE')).orNull,
    storePassword: providers.gradleProperty('APPBUILDER_UPLOAD_STORE_PASSWORD').orElse(providers.environmentVariable('APPBUILDER_UPLOAD_STORE_PASSWORD')).orNull,
    keyAlias: providers.gradleProperty('APPBUILDER_UPLOAD_KEY_ALIAS').orElse(providers.environmentVariable('APPBUILDER_UPLOAD_KEY_ALIAS')).orNull,
    keyPassword: providers.gradleProperty('APPBUILDER_UPLOAD_KEY_PASSWORD').orElse(providers.environmentVariable('APPBUILDER_UPLOAD_KEY_PASSWORD')).orNull,
]
def hasUploadSigning = uploadSigning.values().every { it != null && !it.isEmpty() }
if (uploadSigning.values().any { it != null } && !hasUploadSigning) {
    throw new GradleException('Set all four APPBUILDER_UPLOAD_* signing properties to sign a Play release.')
}

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.helloworld"
    defaultConfig {
        applicationId "com.helloworld"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadSigning) {
            release {
                storeFile file(uploadSigning.storeFile)
                storePassword uploadSigning.storePassword
                keyAlias uploadSigning.keyAlias
                keyPassword uploadSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Without an upload key, release artifacts are signed for local QA only.
            signingConfig hasUploadSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    
    packagingOptions {
        pickFirst 'lib/**/libaosl.so'
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

abstract class ConfigureAppLinks extends DefaultTask {
    private static final String ANDROID = 'http://schemas.android.com/apk/res/android'
    private static final String VIEW = 'android.intent.action.VIEW'
    private static final String DEFAULT = 'android.intent.category.DEFAULT'
    private static final String BROWSABLE = 'android.intent.category.BROWSABLE'

    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getAppConfig()

    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getInputManifest()

    @OutputFile
    abstract RegularFileProperty getOutputManifest()

    @TaskAction
    void configureAppLinks() {
        def endpoint = new JsonSlurper().parse(appConfig.get().asFile).FRONTEND_ENDPOINT
        def host = endpoint instanceof String && endpoint.startsWith('https://')
            ? new URI(endpoint).host?.toLowerCase(Locale.ROOT)
            : null
        def input = inputManifest.get().asFile
        def output = outputManifest.get().asFile
        output.parentFile.mkdirs()
        if (!host) {
            Files.copy(input.toPath(), output.toPath(), StandardCopyOption.REPLACE_EXISTING)
            return
        }

        def factory = DocumentBuilderFactory.newDefaultInstance()
        factory.namespaceAware = true
        def document = factory.newDocumentBuilder().parse(input)
        def activity = elements(document.documentElement, 'activity').find {
            it.getAttributeNS(ANDROID, 'name').endsWith('.MainActivity')
        }
        if (activity == null) {
            throw new GradleException('MainActivity is missing from the merged Android manifest.')
        }

        def filters = elements(activity, 'intent-filter').findAll { filter ->
            def schemes = values(filter, 'data', 'scheme')
            def categories = values(filter, 'category', 'name')
            values(filter, 'data', 'host').toSet() == ([host] as Set) &&
                schemes && schemes.every { it in ['http', 'https'] } &&
                VIEW in values(filter, 'action', 'name') &&
                categories.containsAll([DEFAULT, BROWSABLE])
        }
        if (filters.isEmpty()) {
            def filter = document.createElement('intent-filter')
            activity.appendChild(filter)
            append(filter, 'action', 'name', VIEW)
            append(filter, 'category', 'name', DEFAULT)
            append(filter, 'category', 'name', BROWSABLE)
            append(filter, 'data', 'host', host)
            filters = [filter]
        }

        filters.each { filter ->
            filter.setAttributeNS(ANDROID, 'android:autoVerify', 'true')
            def schemes = values(filter, 'data', 'scheme')
            (['http', 'https'] - schemes).each { append(filter, 'data', 'scheme', it) }
        }
        TransformerFactory.newDefaultInstance().newTransformer()
            .transform(new DOMSource(document), new StreamResult(output))
    }

    static List<String> values(Element parent, String tag, String attribute) {
        elements(parent, tag).collect { it.getAttributeNS(ANDROID, attribute) }.findAll()
    }

    static List<Element> elements(Element parent, String tag) {
        def nodes = parent.getElementsByTagName(tag)
        (0..<nodes.length).collect { (Element) nodes.item(it) }
    }

    static void append(Element parent, String tag, String attribute, String value) {
        def element = parent.ownerDocument.createElement(tag)
        element.setAttributeNS(ANDROID, "android:${attribute}", value)
        parent.appendChild(element)
    }
}

def appBuilderConfig = rootProject.layout.projectDirectory.file('../config.json')

// Work with the merged manifest so existing CLI-generated projects get the fix.
androidComponents.onVariants(androidComponents.selector().all(), { variant ->
    def configureAppLinks = tasks.register("configure${variant.name.capitalize()}AppLinks", ConfigureAppLinks) {
        appConfig.set(appBuilderConfig)
    }
    variant.artifacts.use(configureAppLinks)
        .wiredWithFiles({ it.inputManifest }, { it.outputManifest })
        .toTransform(SingleArtifact.MERGED_MANIFEST.INSTANCE)
} as Action)

// React Native's bundle task tracks sources, but Babel also reads this JSON.
tasks.matching { it.name.startsWith('createBundle') && it.name.endsWith('JsAndAssets') }.configureEach {
    inputs.file(appBuilderConfig)
}
